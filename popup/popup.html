<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki2Grok</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header with Logo -->
    <header class="header">
      <div class="logo-icon">
        <img src="../icons/logo.png" alt="Wiki2Grok" width="80" height="80">
      </div>
      <h1 class="app-title">Wiki2Grok</h1>
      <span class="version">v1.0.0</span>
    </header>

    <!-- Status Card -->
    <div class="status-card">
      <!-- Status Row -->
      <div class="status-row">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Active</span>
      </div>
      <p class="status-description" id="statusDescription">
        Redirecting Wikipedia links to Grokipedia
      </p>

      <div class="divider"></div>

      <!-- Controls Row -->
      <div class="controls-row">
        <div class="toggle-group">
          <label class="toggle-switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="toggle-slider">
              <span class="toggle-label-text">ON</span>
            </span>
          </label>
          <span class="toggle-text">Enable Redirects</span>
        </div>
        <div class="stats-group">
          <span class="stats-label">Redirects:</span>
          <span class="stats-value" id="redirectCount">0</span>
        </div>
      </div>
    </div>

    <!-- Tip Button -->
    <a href="https://tiptopjar.com/wiki2grok" target="_blank" rel="noopener noreferrer" class="tip-btn" id="tipBtn">
      Leave a Tip
    </a>

    <!-- Footer -->
    <footer class="footer">
      <button class="reset-btn" id="resetBtn" title="Reset redirect count">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
        Reset Stats
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
